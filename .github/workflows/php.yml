name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: ['7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
      fail-fast: false
    name: PHP ${{ matrix.php-versions }}

    services:
      clamav:
        image: clamav/clamav:stable
        ports:
          - 3310:3310
        # Share /tmp so that clamd can read files scanned by path (SCAN command)
        # and expose its unix socket (/tmp/clamd.sock) to the runner
        volumes:
          - /tmp:/tmp
        options: >-
          --health-cmd clamdcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    env:
      CLAM_TCP_ADDRESS: tcp://127.0.0.1:3310
      CLAM_UNIX_ADDRESS: unix:///tmp/clamd.sock

    steps:
    - uses: actions/checkout@v2
    
    - name: Set Timezone
      uses: szenius/set-timezone@v1.0
      with:
        timezoneLinux: "Europe/Paris"

    - uses: iFaxity/wait-on-action@v1.2.1
      with:
        resource: tcp://127.0.0.1:3310
        timeout: 300000

    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: json
        ini-values: date.timezone=Europe/Paris
    - name: Check PHP Version
      run: php -v

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run test suite
      run: composer run-script tests

    - name: ClamAV logs
      if: failure()
      run: docker logs ${{ job.services.clamav.id }}
